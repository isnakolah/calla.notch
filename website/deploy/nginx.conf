limit_req_zone $binary_remote_addr zone=signups:1m rate=6r/m;
map $uri $calla_robots {
    ~^/admin "noindex, nofollow";
    ~^/api/ "noindex, nofollow";
    default "";
}
map $uri $calla_public_cors {
    ~^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|index\.md|site\.webmanifest)$ "*";
    default "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json application/octet-stream image/svg+xml;
    client_max_body_size 2k;
    # This origin is published only through a loopback Cloudflare tunnel.
    # Cloudflare replaces CF-Connecting-IP on incoming public requests.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    # Point crawlers and AI agents at the plain-language summary.
    add_header Link "</llms.txt>; rel=\"alternate\"; type=\"text/plain\"" always;
    # Empty values are not sent, so these only apply where the maps match.
    add_header X-Robots-Tag $calla_robots always;
    add_header Access-Control-Allow-Origin $calla_public_cors always;
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json application/xml application/manifest+json;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        application/xml xml;
        text/plain txt;
        text/markdown md;
        text/vtt vtt;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        font/woff2 woff2;
        font/ttf ttf;
        video/mp4 mp4;
        video/webm webm;
        video/quicktime mov;
        application/octet-stream bin;
    }

    location = /api/waitlist {
        limit_req zone=signups burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://waitlist:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location = /healthz { proxy_pass http://waitlist:8000; }
    location = /api/events {
        access_log off;
        proxy_pass http://waitlist:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/admin/ {
        proxy_pass http://waitlist:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /admin { try_files /admin.html =404; }
    location = /admin/ { try_files /admin.html =404; }
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt|index\.md|site\.webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }
    location /api/ { return 404; }
    location ~ /\. { return 404; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /models/ { expires -1; try_files $uri =404; }
    location /demo/ { expires 1h; try_files $uri =404; }
    location /fonts/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
