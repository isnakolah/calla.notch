<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call panel, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#6CB8FF}a:hover{color:#9ACFFF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.caps{font:700 9.5px/1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.ico{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico:hover{background:rgba(255,255,255,.1)}
.end{height:26px;padding:0 12px 0 10px;border-radius:13px;background:rgba(255,107,107,.16);color:#FF8A8A;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:6px;flex:none}
</style>
</helmet>

<div style="width: 600px; height: 280px; background: #000; border-radius: 0 0 28px 28px; box-sizing: border-box; padding: 0 20px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
  <div style="height: 34px; display: flex; align-items: center;">
    <span style="width: 180px; display: flex; align-items: center; gap: 8px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #5BE49B; box-shadow: 0 0 0 3px rgba(91,228,155,.22);"></span>
      <span style="font-size: 12px; font-weight: 600; color: #5BE49B;">Listening</span>
    </span>
    <span style="flex-grow: 1;"></span>
    <span style="width: 180px; display: flex; align-items: center; justify-content: flex-end; gap: 2px;">
      <span class="mono" style="font-size: 12px; color: rgba(255,255,255,.8); margin-right: 6px;">06:12</span>
      <button class="ico" aria-label="Screenshot the shared screen"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="ico" aria-label="Float on top of everything"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><rect x="12" y="11" width="6.5" height="5.5" rx="1" fill="rgba(255,255,255,.75)" stroke="none"/></svg></button>
      <button class="ico" aria-label="Keep the panel open"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/></svg></button>
      <button class="ico" aria-label="Full, with the transcript"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.75)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3l-7 7M21 3h-5M21 3v5M3 21l7-7M3 21h5M3 21v-5"/></svg></button>
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 2px 8px 0; flex-grow: 1;">
    <div style="display: flex; flex-direction: column; gap: 5px;">
      <span style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #5BE49B;">NEW</span><span class="mono" style="font-size: 10.5px; color: rgba(255,255,255,.5);">14:10</span></span>
      <span style="font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em;">Seat count is still open: they said somewhere between 40 and 60.</span>
    </div>
    <div style="height: 1px; background: rgba(255,255,255,.10);"></div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="display: flex; gap: 10px; align-items: baseline;"><span class="mono" style="width: 34px; flex: none; font-size: 10.5px; color: rgba(255,255,255,.45);">13:52</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#5BE49B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M5 12.5l4.2 4.2L19 7"/></svg><span style="font-size: 12.5px; line-height: 1.4; color: rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Dana signs the renewal, after finance</span></span>
      <span style="display: flex; gap: 10px; align-items: baseline;"><span class="mono" style="width: 34px; flex: none; font-size: 10.5px; color: rgba(255,255,255,.45);">13:20</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="3" aria-hidden="true" style="flex: none;"><circle cx="12" cy="12" r="3" fill="rgba(255,255,255,.6)"/></svg><span style="font-size: 12.5px; line-height: 1.4; color: rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Finance needs the security letter before signing</span></span>
      <span style="display: flex; gap: 10px; align-items: baseline;"><span class="mono" style="width: 34px; flex: none; font-size: 10.5px; color: rgba(255,255,255,.45);">12:05</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFD15C" stroke-width="3" aria-hidden="true" style="flex: none;"><circle cx="12" cy="12" r="8"/></svg><span style="font-size: 12.5px; line-height: 1.4; color: rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Still open: who approves after Dana</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: auto;">
      <span style="font-size: 11px; color: rgba(255,255,255,.5);">Points arrive as the call goes · the transcript is in full view</span>
      <span style="flex-grow: 1;"></span>
      <button class="end"><svg width="9" height="9" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="#FF8A8A"/></svg>End call</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":280}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
