<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floating strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#202227;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#6CB8FF}a:hover{color:#9ACFFF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.glass{background:rgba(24,25,30,.74);-webkit-backdrop-filter:blur(30px) saturate(1.6);backdrop-filter:blur(30px) saturate(1.6);border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09)}
.strip{width:420px;height:58px;border-radius:29px;display:flex;align-items:center;gap:12px;padding:0 10px 0 20px;box-sizing:border-box}
.ico{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cap{font-size:12px;line-height:1.45;color:rgba(255,255,255,.7);padding-left:8px}
</style>
</helmet>

<div style="width: 440px; height: 240px; position: relative; overflow: hidden; background: #202227; box-sizing: border-box; padding: 20px 10px; display: flex; flex-direction: column; gap: 10px;">
  <div aria-hidden="true" style="position: absolute; left: 260px; top: -20px; width: 220px; height: 140px; border-radius: 16px; background: #4E3F5C;"></div>
  <div aria-hidden="true" style="position: absolute; left: -40px; top: 120px; width: 220px; height: 140px; border-radius: 16px; background: #3A4A5E;"></div>

  <div class="glass strip" style="position: relative;">
    <span style="width: 8px; height: 8px; border-radius: 50%; background: #5BE49B; box-shadow: 0 0 0 4px rgba(91,228,155,.18); flex: none;"></span>
    <span style="flex-grow: 1; min-width: 0; font-size: 13px; color: rgba(255,255,255,.92); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Finance needs the security letter before signing.</span>
    <span class="mono" style="font-size: 11.5px; color: rgba(255,255,255,.6);">14:02</span>
    <button class="ico" aria-label="Expand the window"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <span class="cap" style="position: relative;">Where it stands, in one line. Sits under the camera or in a corner of the video.</span>

  <div class="glass strip" style="position: relative; margin-top: 8px; box-shadow: 0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(91,228,155,.35), inset 0 1px 0 rgba(255,255,255,.09);">
    <span style="font-size: 11px; font-weight: 700; color: #5BE49B; letter-spacing: .06em;">NEW</span>
    <span style="flex-grow: 1; min-width: 0; font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Seat count is open: 40 to 60.</span>
    <span class="mono" style="font-size: 11.5px; color: rgba(255,255,255,.6);">14:10</span>
    <button class="ico" aria-label="Expand the window"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <span class="cap" style="position: relative;">A change says “New” for six seconds, in place. The strip never jumps in size.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":240}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
