<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call panel today</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#6CB8FF}a:hover{color:#9ACFFF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.ind{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.big{height:36px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);font-size:12.5px;font-weight:600;color:rgba(255,255,255,.88);display:inline-flex;align-items:center;gap:7px;flex:none}
</style>
</helmet>

<div style="width: 600px; height: 280px; background: #0B0B0D; border-radius: 0 0 28px 28px; box-sizing: border-box; padding: 0 20px 12px; display: flex; flex-direction: column; overflow: hidden; border: 0.5px solid rgba(255,255,255,.08);">
  <div style="height: 34px; display: flex; align-items: center;">
    <span style="display: flex; align-items: center; gap: 9px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #5BE49B; box-shadow: 0 0 0 4px rgba(91,228,155,.18);"></span>
      <span style="font-size: 12px; font-weight: 600; color: #5BE49B;">Listening</span>
      <span class="mono" style="font-size: 12px; color: rgba(255,255,255,.8);">6:12</span>
    </span>
    <span style="flex-grow: 1;"></span>
    <span class="ind" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <span class="ind" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3.1 4.1M6.6 6.6A13 13 0 0 0 2 12c1 2.5 5 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/></svg></span>
    <button class="ind" aria-label="Float"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><rect x="12" y="11" width="6.5" height="5.5" rx="1" fill="rgba(255,255,255,.7)" stroke="none"/></svg></button>
    <button class="ind" aria-label="Unpin"><svg width="13" height="13" viewBox="0 0 24 24" fill="#5BE49B" stroke="#5BE49B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/></svg></button>
    <button class="ind" aria-label="Full view"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3l-7 7M21 3h-5M21 3v5M3 21l7-7M3 21h5M3 21v-5"/></svg></button>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; padding-top: 8px;">
    <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><g fill="#5BE49B"><rect x="0" y="8" width="3.5" height="6" rx="1.7"/><rect x="7" y="3" width="3.5" height="16" rx="1.7"/><rect x="14" y="6" width="3.5" height="10" rx="1.7"/><rect x="21" y="0" width="3.5" height="22" rx="1.7"/></g></svg>
    <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
      <span style="font-size: 20px; font-weight: 600; letter-spacing: -.01em;">Listening to both sides</span>
      <span style="font-size: 13px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Where it stands · They want a two-year deal. Finance needs the security…</span>
    </span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding-top: 18px;">
    <button class="big">Screenshot</button>
    <button class="big" style="background: rgba(91,228,155,.16); color: #5BE49B;">Unpin</button>
    <button class="big">Full view</button>
    <span style="flex-grow: 1;"></span>
    <button class="big" style="background: rgba(255,107,107,.16); color: #FF8A8A; border-color: rgba(255,107,107,.3);">End call</button>
  </div>

  <div style="margin-top: auto; height: 22px; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap;">
    <span style="font-size: 10px; font-weight: 700; letter-spacing: .08em; color: #5BE49B;">DANA</span>
    <span style="font-size: 12px; color: rgba(255,255,255,.75);">The security letter first, then it comes back to me. · MARCO Probably 40 seats, could be…</span>
  </div>
</div>
</x-dc>
