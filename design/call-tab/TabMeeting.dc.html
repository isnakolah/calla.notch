<helmet>
<style>
body{margin:0;background:#000;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#409CFF}a:hover{color:#6BB2FF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;white-space:nowrap}
.caps{font:700 10.5px/1 system-ui,-apple-system,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.tb{height:22px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:rgba(255,255,255,.76);flex:none}
.tb:hover{background:rgba(255,255,255,.08);color:#fff}
.go{height:30px;padding:0 14px;border-radius:15px;background:#0A84FF;color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;flex:none}
.chip{height:28px;padding:0 11px;border-radius:14px;font-size:13px;font-weight:500;color:rgba(255,255,255,.78);display:inline-flex;align-items:center;flex:none}
.chip:hover{background:rgba(255,255,255,.08)}
.ico{width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.seg{height:20px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;color:rgba(255,255,255,.66)}
</style>
</helmet>

<div style="width: 512px; height: 168px; background: #000; border-radius: 0 0 24px 24px; display: flex; flex-direction: column; overflow: hidden;">
  <div style="height: 38px; display: flex; align-items: center; padding: 0 14px; gap: 2px; flex: none;">
    <span class="ico" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg></span>
    <span class="ico" style="background: rgba(64,156,255,.2);" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6BB2FF" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></span>
    <span style="flex-grow: 1;"></span>
    <span class="ico" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></span>
  </div>

  <div style="flex-grow: 1; padding: 4px 24px 14px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 8px; height: 20px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #409CFF; box-shadow: 0 0 9px #409CFF;"></span>
      <span class="caps">Meeting · in 03:58</span>
      <span style="flex-grow: 1;"></span>
      <button class="tb">3 today<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <span style="display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(255,255,255,.06);">
        <button class="seg" style="background: rgba(255,255,255,.14); color: #fff;">Call</button>
        <button class="seg">Quiz</button>
      </span>
    </div>
    <span style="font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin-top: 7px;">Acme renewal sync</span>
    <span style="font-size: 12.5px; color: rgba(255,255,255,.76); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">10:00 · Sales · last Acme sync was Sales, guests from acme.com</span>
    <div style="display: flex; align-items: center; gap: 2px; margin-top: auto; margin-left: -11px;">
      <button class="chip" style="background: rgba(255,255,255,.14); color: #fff; box-shadow: inset 0 0 0 1px rgba(64,156,255,.75);">Sales</button>
      <button class="chip">Support</button>
      <button class="chip">General</button>
      <button class="chip" style="color: #8CC4FF;">More…</button>
      <span style="flex-grow: 1;"></span>
      <button class="go">Join and listen</button>
    </div>
  </div>
</div>
</x-dc>
