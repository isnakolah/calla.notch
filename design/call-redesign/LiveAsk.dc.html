<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Calla</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#409CFF}a:hover{color:#6BB2FF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.caps{font:700 9.5px/1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.rounded{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tb{height:32px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.78);flex:none}
.tb:hover{background:rgba(255,255,255,.08);color:#fff}
.kbd{font:500 10.5px/1 ui-rounded,system-ui,sans-serif;color:rgba(255,255,255,.5)}
.ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico:hover{background:rgba(255,255,255,.1)}
.end{color:#FF6961;font-weight:600}
</style>
</helmet>

<div style="width: 600px; height: 340px; background: #000; border-radius: 0 0 28px 28px; box-sizing: border-box; padding: 10px 20px 14px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 46px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; gap: 8px; height: 26px; position: relative;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #30D158; box-shadow: 0 0 10px #30D158;"></span>
    <span class="caps" style="color: rgba(255,255,255,.78);">Listening · both sides</span>
    <span style="flex-grow: 1;"></span>
    <span class="rounded" style="font-size: 11.5px; color: rgba(255,255,255,.72); margin-right: 4px;">06:52</span>
    <button class="ico" aria-label="Float on top of everything"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><rect x="12" y="11" width="6.5" height="5.5" rx="1" fill="rgba(255,255,255,.8)" stroke="none"/></svg></button>
    <button class="ico" aria-label="Fold the notch up"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>

  <div style="display: flex; gap: 18px; flex-grow: 1; min-height: 0; position: relative;">
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
      <span style="align-self: flex-start; font-size: 11px; color: #7EE29A;">About “the security letter first”</span>
      <label style="display: flex; align-items: center; gap: 9px; height: 40px; border-bottom: 1.5px solid #0A84FF;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#30D158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/></svg>
        <input type="text" aria-label="Your question" placeholder="Ask about this call. Type, or just speak." style="flex-grow: 1; min-width: 0; background: none; border: 0; outline: none; color: #fff; font: 15px system-ui, -apple-system, sans-serif;">
        <span class="kbd">↩</span>
      </label>
      <button class="tb" style="margin-left: -10px; font-size: 13px; color: rgba(255,255,255,.85);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#409CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>What have they agreed to so far?</button>
      <button class="tb" style="margin-left: -10px; font-size: 13px; color: rgba(255,255,255,.85);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#409CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Summarise the last five minutes</button>
      <button class="tb" style="margin-left: -10px; font-size: 13px; color: rgba(255,255,255,.85);"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#409CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>What should I ask next?</button>
    </div>
    <div style="width: 200px; flex: none; border-left: 1px solid rgba(255,255,255,.10); padding: 2px 0 0 18px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
      <span class="caps">Said just now</span>
      <span style="display: flex; flex-direction: column; gap: 3px;"><span class="caps" style="color: rgba(255,255,255,.5);">You</span><span style="font-size: 12px; line-height: 1.38; color: rgba(255,255,255,.55);">Understood. What does finance need from us?</span></span>
      <span style="display: flex; flex-direction: column; gap: 3px;"><span class="caps" style="color: rgba(255,255,255,.5);">Dana</span><span style="font-size: 12px; line-height: 1.38; color: rgba(255,255,255,.7);">The <span style="background: rgba(48,209,88,.3); color: #fff; border-radius: 3px; padding: 0 2px;">security letter first</span>, then it comes back to me.</span></span>
      <span style="flex-grow: 1;"></span>
      <span style="font-size: 11px; line-height: 1.4; color: rgba(255,255,255,.5);">Select words here, then press ⌥Space to ask about them.</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 2px; margin-left: -10px; position: relative;">
    <button class="tb" style="color: #409CFF;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Ask <span class="kbd">⌥Space</span></button>
    <button class="tb"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 6H9M20 12H9M20 18H9M5 6v.01M5 12v.01M5 18v.01"/></svg>Hide transcript</button>
    <button class="tb">Cancel <span class="kbd">esc</span></button>
    <span style="flex-grow: 1;"></span>
    <button class="ico" aria-label="More options" style="width: 32px; height: 32px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="rgba(255,255,255,.75)" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    <button class="tb end">End call</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":340}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
