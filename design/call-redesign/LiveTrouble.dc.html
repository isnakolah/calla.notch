<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Something needs you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#409CFF}a:hover{color:#6BB2FF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.caps{font:700 9.5px/1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.rounded{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tb{height:32px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.78);flex:none}
.tb:hover{background:rgba(255,255,255,.08);color:#fff}
.kbd{font:500 10.5px/1 ui-rounded,system-ui,sans-serif;color:rgba(255,255,255,.5)}
.ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.end{color:#FF6961;font-weight:600}
.fix{height:34px;padding:0 18px;border-radius:17px;background:#FF9F0A;color:#1A1206;font-size:13px;font-weight:600;display:inline-flex;align-items:center;flex:none}
</style>
</helmet>

<div style="width: 600px; height: 340px; background: #000; border-radius: 0 0 28px 28px; box-sizing: border-box; padding: 10px 20px 14px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 46px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none;"></div>
  <div style="position: absolute; left: 10px; top: 40px; width: 340px; height: 170px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,159,10,.2), rgba(0,0,0,0)); filter: blur(28px); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; gap: 8px; height: 26px; position: relative;">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF9F0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.01"/></svg>
    <span class="caps" style="color: rgba(255,255,255,.78);">Listening · only you</span>
    <span style="flex-grow: 1;"></span>
    <span class="rounded" style="font-size: 11.5px; color: rgba(255,255,255,.72); margin-right: 4px;">08:47</span>
    <button class="ico" aria-label="Fold the notch up"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; position: relative; max-width: 480px;">
    <span style="font-size: 20px; font-weight: 650; letter-spacing: -.015em;">Their side stopped coming through</span>
    <span style="font-size: 13px; line-height: 1.45; color: rgba(255,255,255,.72);">Nothing they said since 08:10 was heard, probably because your headphones changed. You are still being written down.</span>
    <span style="display: flex; align-items: center; gap: 6px; margin-top: 8px; margin-left: -2px;">
      <button class="fix">Reconnect their audio</button>
      <button class="tb">Keep going with only me</button>
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; position: relative; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.10);">
    <span class="caps">Where it stands · up to 08:10</span>
    <span style="font-size: 13px; line-height: 1.4; color: rgba(255,255,255,.72);">Two-year deal at 8% with the onboarding credit. Security letter goes to Dana first.</span>
  </div>

  <div style="display: flex; align-items: center; gap: 2px; margin-left: -10px; margin-top: auto; position: relative;">
    <button class="tb"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Ask <span class="kbd">⌥Space</span></button>
    <button class="tb"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 6H9M20 12H9M20 18H9M5 6v.01M5 12v.01M5 18v.01"/></svg>Show transcript</button>
    <span style="flex-grow: 1;"></span>
    <button class="ico" aria-label="More options" style="width: 32px; height: 32px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="rgba(255,255,255,.75)" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    <button class="tb end">End call</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":340}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
