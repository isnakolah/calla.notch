<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Floating strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#2A2C31;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#409CFF}a:hover{color:#6BB2FF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.rounded{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.strip{width:400px;height:52px;background:#000;border:1px solid rgba(255,255,255,.14);border-radius:26px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 8px 0 18px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.ico{width:34px;height:34px;border-radius:17px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico:hover{background:rgba(255,255,255,.1)}
.cap{font-size:12px;line-height:1.45;color:rgba(255,255,255,.72)}
</style>
</helmet>

<div style="width: 440px; height: 260px; background: #2A2C31; box-sizing: border-box; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px;">
  <div class="strip">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #30D158; box-shadow: 0 0 9px #30D158; flex: none;"></span>
    <span style="flex-grow: 1; min-width: 0; font-size: 13px; color: rgba(255,255,255,.88); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Finance needs the security letter before signing.</span>
    <span class="rounded" style="font-size: 11.5px; color: rgba(255,255,255,.6);">06:12</span>
    <button class="ico" aria-label="Expand the window"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <span class="cap" style="padding-left: 6px;">Shrunk: the latest line of where it stands. Small enough to sit under the camera.</span>

  <div class="strip" style="margin-top: 14px; box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,159,10,.35);">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #FF9F0A; box-shadow: 0 0 9px #FF9F0A; flex: none;"></span>
    <span style="flex-grow: 1; min-width: 0; font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Yes to two years. Hold at 8%, offer the credit.</span>
    <button class="ico" aria-label="Expand to the full answer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>
  <span class="cap" style="padding-left: 6px;">An answer arrives: the strip shows it in place, no jump in size. Hover for the full answer.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":260}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
