<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000;font-family:system-ui,-apple-system,"SF Pro Text",sans-serif;color:#fff}
a{color:#409CFF}a:hover{color:#6BB2FF}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.caps{font:700 9.5px/1 system-ui,-apple-system,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.rounded{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tb{height:32px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.78);flex:none}
.tb:hover{background:rgba(255,255,255,.08);color:#fff}
.go{height:34px;padding:0 18px;border-radius:17px;background:#0A84FF;color:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;flex:none}
.todo{display:flex;align-items:center;gap:10px;cursor:pointer}
.who{font-size:11.5px;color:rgba(255,255,255,.5)}
.li{font-size:13px;line-height:1.4;color:rgba(255,255,255,.9)}
</style>
</helmet>

<div style="width: 600px; height: 420px; background: #000; border-radius: 0 0 28px 28px; box-sizing: border-box; padding: 10px 20px 16px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 46px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; gap: 8px; height: 26px; position: relative;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #8E8E93;"></span>
    <span class="caps" style="color: rgba(255,255,255,.78);">Call ended · recap ready</span>
    <span style="flex-grow: 1;"></span>
    <span class="rounded" style="font-size: 11.5px; color: rgba(255,255,255,.72);">32 min · 4 people</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px; position: relative;">
    <span style="font-size: 20px; font-weight: 650; letter-spacing: -.015em;">Acme renewal sync</span>
    <span style="font-size: 13px; color: rgba(255,255,255,.72); line-height: 1.4;">They will sign for two years at 8% with the onboarding credit, once security clears.</span>
  </div>

  <div style="display: flex; gap: 22px; position: relative; flex-grow: 1; min-height: 0;">
    <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 9px;">
      <span class="caps">Decided</span>
      <span class="li">Two-year term, once the security review clears.</span>
      <span class="li">Onboarding credit instead of a bigger discount.</span>
      <span class="caps" style="margin-top: 8px;">Still open</span>
      <span class="li">Seat count, between 40 and 60.</span>
    </div>
    <div style="flex: 1.3 1 0; min-width: 0; display: flex; flex-direction: column; gap: 11px; border-left: 1px solid rgba(255,255,255,.10); padding-left: 22px;">
      <span class="caps">To do</span>
      <label class="todo"><input type="checkbox" style="width: 15px; height: 15px; accent-color: #30D158; margin: 0; flex: none;"><span style="display: flex; flex-direction: column; gap: 2px;"><span class="li">Send the security letter to Dana</span><span class="who">You · by Friday</span></span></label>
      <label class="todo"><input type="checkbox" style="width: 15px; height: 15px; accent-color: #30D158; margin: 0; flex: none;"><span style="display: flex; flex-direction: column; gap: 2px;"><span class="li">Book a call with their IT lead</span><span class="who">Dana · next week</span></span></label>
      <label class="todo"><input type="checkbox" style="width: 15px; height: 15px; accent-color: #30D158; margin: 0; flex: none;"><span style="display: flex; flex-direction: column; gap: 2px;"><span class="li">Confirm the seat count</span><span class="who">Marco · Tuesday</span></span></label>
      <button style="align-self: flex-start; font-size: 12px; color: #8CC4FF;">Add all to Reminders</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 2px; margin-left: -10px; position: relative;">
    <button class="tb"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 7l8 6 8-6"/></svg>Copy follow-up email</button>
    <button class="tb">Open in Past calls</button>
    <span style="flex-grow: 1;"></span>
    <button class="go">Done</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":420}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
